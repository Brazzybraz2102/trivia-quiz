[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nextbox"
version = "2.0.1"
description = "Your to-do list on label printers and paper, with photo read-back and a private journal"
requires-python = ">=3.11"  # SQLAlchemy 2.1 and websockets 17 (constraints.txt) need 3.11
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "pillow>=10",
    "brother-ql-inventree>=1.3",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "anthropic>=1.0",
    "pydantic>=2",
    "caldav>=3.3",
    "cryptography>=43",
    "sqlalchemy>=2.0",
    "zeroconf>=0.136",  # Set up a printer: finds printers on the home network (Bonjour), only listening
    "qrcode>=8.0",      # Friends: your friend link as a QR code (pure Python; draws with Pillow)
]

[project.optional-dependencies]
dev = ["pytest>=8", "radicale>=3.8"]
postgres = ["psycopg[binary]>=3.2"]
heic = ["pillow-heif>=0.18"]  # iPhone HEIC photos on Snap

[project.scripts]
nextbox = "nextbox.cli:main"

[tool.setuptools]
packages = ["nextbox", "nextbox.providers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
