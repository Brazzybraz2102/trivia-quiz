[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nextbox"
version = "0.6.0"
description = "Todoist to Brother QL-1110NWB label printer, with photo read-back"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "pillow>=10",
    "brother-ql-inventree>=1.3",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "anthropic>=1.0",
    "pydantic>=2",
    "caldav>=3.3",
    "cryptography>=43",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "radicale>=3.8"]
postgres = ["psycopg[binary]>=3.2"]

[project.scripts]
nextbox = "nextbox.cli:main"

[tool.setuptools]
packages = ["nextbox", "nextbox.providers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
