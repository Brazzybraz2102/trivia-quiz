# Home Assistant package for Next Box.
# 1. In configuration.yaml:   homeassistant: { packages: !include_dir_named packages }
# 2. Copy this file to <config>/packages/nextbox.yaml
# 3. In secrets.yaml add:
#      nextbox_print_today_url: http://<desktop-ip>:8787/print/today
#      nextbox_key: <same NEXTBOX_KEY as next-box/.env>
# 4. Replace the two CHANGEME entity IDs below, then reload YAML.
#
# The office-entry automation is the ONLY automatic print. The server guards it: a second
# source="auto" call on the same day returns {"status": "skipped"}, so HA retries,
# presence flapping or a restart can never print twice.

rest_command:
  nextbox_today_auto:
    url: !secret nextbox_print_today_url   # e.g. http://<desktop-ip>:8787/print/today
    method: POST
    headers:
      X-NextBox-Key: !secret nextbox_key
    content_type: application/json
    payload: '{"source": "auto"}'
    timeout: 30
  nextbox_today_manual:
    url: !secret nextbox_print_today_url
    method: POST
    headers:
      X-NextBox-Key: !secret nextbox_key
    content_type: application/json
    payload: '{"source": "manual"}'
    timeout: 30

automation:
  - id: nextbox_auto_today_on_office_entry
    alias: "Next Box: print today when I enter the office (once a day)"
    mode: single
    trigger:
      - platform: state
        entity_id: binary_sensor.CHANGEME_office_presence
        from: "off"
        to: "on"
    condition:
      - condition: time
        after: "05:00:00"
        before: "20:00:00"
    action:
      - service: rest_command.nextbox_today_auto

  - id: nextbox_button_print_today
    alias: "Next Box: button prints today"
    mode: single
    trigger:
      # For a physical button exposed as an event entity or input_button, use a state trigger:
      - platform: state
        entity_id: input_button.CHANGEME_nextbox_button
    action:
      - service: rest_command.nextbox_today_manual
