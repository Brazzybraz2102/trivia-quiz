<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Braznarkel Ranch Fall Fest 2026 · Big Screen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rye&family=Alfa+Slab+One&family=Barlow:wght@500;600;700;800&display=swap">
<link rel="stylesheet" href="/static/theme.css">
<style>
body { overflow-x: hidden; }
#sky { position: fixed; inset: 0; z-index: -2; pointer-events: none; }
.scene { position: fixed; left: 0; right: 0; bottom: 0; height: min(30vh, 300px); z-index: -1; pointer-events: none; transition: opacity .6s; }
.scene svg { width: 100%; height: 100%; display: block; }
body.playing .scene { opacity: .35; }
.blade { transform-box: fill-box; transform-origin: center; animation: spin 14s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.glow { animation: flicker 4s ease-in-out infinite; }
@keyframes flicker { 50% { opacity: .78; } }
.stage { min-height: 100%; display: flex; flex-direction: column; gap: 20px; padding-block: 20px 84px; max-width: 1500px; margin: 0 auto; }
.top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; font-size: 22px; }
.brand .badge { width: 44px; filter: none; }
.top .spacer { flex: 1; }
.joinchip { font-weight: 700; color: var(--muted); }
.joinchip b { color: var(--mustard); }

/* lobby */
.lobby { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 28px; align-items: start; }
.hero { display: flex; flex-direction: column; gap: 22px; min-width: 0; }
.mark { display: flex; align-items: center; gap: clamp(16px, 2.4vw, 34px); }
.mark .seal { width: clamp(150px, 17vw, 270px); flex: none; }
.fresh .mark .seal { animation: stamp .7s cubic-bezier(.2,1.5,.4,1); }
@keyframes stamp { from { transform: scale(1.6) rotate(-14deg); opacity: 0; } }
.wordmark { display: flex; flex-direction: column; min-width: 0; }
.wordmark .ranch { font-size: clamp(22px, 2.7vw, 44px); line-height: 1; letter-spacing: .06em; }
.wordmark .event { font-size: clamp(60px, 9vw, 150px); line-height: .92; margin-top: .06em; }
.ribbon {
  align-self: flex-start; margin-top: 10px; position: relative; background: var(--cranberry); color: var(--cream);
  font-family: var(--f-display); font-size: clamp(20px, 2.2vw, 34px); letter-spacing: .3em; padding: .12em .6em .12em .9em;
  box-shadow: 0 5px 0 #070504; clip-path: polygon(0 0, 100% 0, calc(100% - .45em) 50%, 100% 100%, 0 100%, .45em 50%);
}
.joincard { display: flex; gap: 22px; align-items: center; background: var(--cream); color: var(--ink); border-radius: 20px; padding: 20px; box-shadow: var(--shadow); max-width: 680px; }
.joincard .qr { flex: none; width: clamp(130px, 13vw, 190px); aspect-ratio: 1; background: #fff; border-radius: 10px; padding: 6px; position: relative; z-index: 1; }
.joincard .qr svg { width: 100%; height: 100%; display: block; }
.joincard .url { font-family: var(--f-display); font-size: clamp(22px, 2.6vw, 38px); word-break: break-all; line-height: 1.05; }
.joincard .eyebrow { color: #8a5a2b; }
.roster { background: var(--night-2); border-radius: 20px; padding: 20px; box-shadow: var(--shadow); min-width: 0; color: var(--cream); }
.roster-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 12px; }
.roster-head h2 { font-family: var(--f-brand); font-weight: 400; font-size: 30px; color: var(--mustard); }
.plist { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; position: relative; z-index: 1; }
.pl { display: flex; align-items: center; gap: 10px; background: var(--night); border-radius: 14px; padding: 8px 10px; min-width: 0; position: relative; }
.pl.just, .waiting .avatar.just { animation: pop .35s cubic-bezier(.2,1.6,.4,1); }
.pl .nm { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
.pl .sc { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.pl.off { opacity: .45; }
.pl .kick { background: none; border: 0; color: var(--muted); font-size: 18px; padding: 2px 6px; border-radius: 8px; }
.pl .kick:hover { color: var(--cranberry); background: #0004; }
.empty { color: var(--muted); padding: 24px 8px; text-align: center; }
@keyframes pop { from { transform: scale(.4); opacity: 0; } }

.section-title { font-family: var(--f-brand); font-weight: 400; font-size: 34px; color: var(--mustard); display: flex; align-items: center; gap: 14px; }
.section-title::after { content: ""; flex: 1; height: 3px; background: repeating-linear-gradient(90deg, var(--night-3) 0 10px, transparent 10px 16px); }
.games { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 18px; }
.gcard { border-radius: 18px; padding: 20px; box-shadow: var(--shadow); color: var(--ink); display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.gcard > * { position: relative; z-index: 1; }
.gcard:nth-child(4n+1) { background: var(--pumpkin); transform: rotate(-1deg); }
.gcard:nth-child(4n+2) { background: var(--mustard); transform: rotate(.8deg); }
.gcard:nth-child(4n+3) { background: var(--teal); transform: rotate(-.6deg); }
.gcard:nth-child(4n+4) { background: var(--cranberry); color: var(--cream); transform: rotate(1deg); }
.gcard h3 { font-family: var(--f-display); font-weight: 400; font-size: 26px; line-height: 1.02; }
.gcard p { margin: 0; font-weight: 600; flex: 1; }
.gcard .meta { font-size: 13px; font-weight: 700; opacity: .75; }
.gcard .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.stepper { display: inline-flex; align-items: center; background: #0002; border-radius: 12px; }
.stepper button { background: none; border: 0; width: 36px; height: 36px; font-size: 20px; font-weight: 700; color: inherit; }
.stepper span { min-width: 92px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }
.gcard .btn { background: var(--ink); color: var(--cream); margin-left: auto; }
.flash { background: var(--cranberry); color: var(--cream); border-radius: 14px; padding: 10px 16px; font-weight: 600; }

/* in-game */
.gamehead { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.gamehead .gt { font-family: var(--f-brand); font-size: 26px; color: var(--mustard); }
.gamehead .spacer { flex: 1; }
.gamehead .clock { font-size: 34px; }
.count { color: var(--muted); font-weight: 600; }
.center { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; text-align: center; }
.big-q { font-family: var(--f-display); font-size: clamp(30px, 4.4vw, 68px); line-height: 1.08; max-width: 24ch; text-shadow: 0 4px 0 #070504; text-wrap: balance; }
.big-q .blank { display: inline-block; min-width: 3.5em; border-bottom: .12em solid var(--mustard); color: var(--mustard); }
.intro h1 { font-family: var(--f-brand); font-size: clamp(56px, 8.5vw, 140px); line-height: 1; }
.intro .seal { width: clamp(110px, 12vw, 170px); }
.fresh .intro h1 { animation: drop .6s cubic-bezier(.2,1.4,.4,1); }
.intro p { font-size: clamp(20px, 2.2vw, 32px); max-width: 34ch; margin: 0; }
@keyframes drop { from { transform: translateY(-60px) rotate(-6deg); opacity: 0; } }

.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; width: 100%; max-width: 1200px; }
.tile { background: var(--c); color: var(--ink); border-radius: 20px; padding: 18px 22px; display: flex; align-items: center; gap: 16px; box-shadow: var(--shadow); text-align: left; min-width: 0; transition: opacity .3s, transform .3s; }
.tile .shape { font-size: 34px; width: 52px; height: 52px; display: grid; place-items: center; background: #0002; border-radius: 12px; flex: none; }
.tile .tx { font-size: clamp(20px, 2.3vw, 36px); font-weight: 700; flex: 1; min-width: 0; overflow-wrap: anywhere; }
.tile .n { font-family: var(--f-display); font-size: 28px; }
.tile.dim { opacity: .28; transform: scale(.97); }
.tile.win { outline: 6px solid var(--cream); transform: scale(1.03); }

.waiting { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; max-width: 1100px; }
.waiting .avatar { transition: opacity .2s, transform .2s; }
.waiting .avatar.pending { opacity: .25; transform: scale(.85); filter: grayscale(1); }
.hint { color: var(--muted); font-size: clamp(16px, 1.6vw, 22px); font-weight: 600; }

.chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
.chip { display: inline-flex; align-items: center; gap: 8px; background: var(--night-2); border-radius: 999px; padding: 4px 14px 4px 4px; font-weight: 700; }
.chip.good b { color: var(--leaf); }
.chip b { font-variant-numeric: tabular-nums; }

.fibs { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; width: 100%; max-width: 1300px; }
.fib { background: var(--night-2); border-radius: 18px; padding: 16px 18px; box-shadow: var(--shadow); text-align: left; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.fresh .fib { animation: pop .4s backwards; }
.fib .tx { font-family: var(--f-display); font-size: clamp(20px, 2.2vw, 32px); text-transform: uppercase; overflow-wrap: anywhere; }
.fib.truth { background: var(--leaf); color: var(--ink); transform: rotate(-1deg) scale(1.03); }
.fib .tag { font-size: 13px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; opacity: .8; }
.fib .who { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 15px; font-weight: 600; }

.vs { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 20px; align-items: stretch; width: 100%; max-width: 1300px; }
.vs .mid { align-self: center; font-family: var(--f-display); font-size: 48px; color: var(--pumpkin); text-shadow: 0 4px 0 #070504; }
.quip { border-radius: 24px; padding: 26px; box-shadow: var(--shadow); color: var(--ink); display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.fresh .quip { animation: drop .5s cubic-bezier(.2,1.4,.4,1) backwards; }
.quip.a { background: var(--mustard); transform: rotate(-1.5deg); }
.quip.b { background: var(--teal); transform: rotate(1.5deg); animation-delay: .15s; }
.quip .tx { font-family: var(--f-display); font-size: clamp(26px, 3.4vw, 54px); line-height: 1.08; overflow-wrap: anywhere; flex: 1; }
.quip .by { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 20px; }
.quip .votes { display: flex; flex-wrap: wrap; gap: 4px; }
.quip .pts { font-family: var(--f-display); font-size: 34px; margin-left: auto; }
.quip.loser { opacity: .7; }
.sweep { font-family: var(--f-display); font-size: clamp(36px, 5vw, 72px); color: var(--pumpkin); text-shadow: 0 5px 0 #070504; transform: rotate(-3deg); }
.fresh .sweep { animation: drop .5s .3s backwards; }

.answer-big { font-family: var(--f-display); font-size: clamp(64px, 10vw, 160px); color: var(--leaf); text-shadow: 0 6px 0 #070504; line-height: 1; font-variant-numeric: tabular-nums; }
.ranks { display: flex; flex-direction: column; gap: 8px; width: min(760px, 100%); }
.rank { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto auto; gap: 14px; align-items: center; background: var(--night-2); border-radius: 14px; padding: 8px 16px 8px 8px; font-weight: 700; font-size: 20px; text-align: left; font-variant-numeric: tabular-nums; }
.fresh .rank { animation: pop .4s backwards; }
.rank .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rank .g { color: var(--muted); }
.rank b { color: var(--leaf); min-width: 70px; text-align: right; }

.board { display: flex; flex-direction: column; gap: 10px; width: min(820px, 100%); }
.brow { display: grid; grid-template-columns: 48px 52px minmax(0, 1fr) auto auto; align-items: center; gap: 14px; background: var(--night-2); border-radius: 16px; padding: 8px 18px 8px 10px; font-size: 22px; font-weight: 700; text-align: left; }
.fresh .brow { animation: pop .45s backwards; }
.brow .pos { font-family: var(--f-display); color: var(--muted); text-align: center; }
.brow .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.brow .gain { color: var(--leaf); font-size: 17px; }
.brow .tot { font-family: var(--f-display); font-variant-numeric: tabular-nums; min-width: 110px; text-align: right; }
.brow.first { background: var(--mustard); color: var(--ink); transform: scale(1.03); }
.brow.first .pos, .brow.first .gain { color: var(--ink); }

/* control bar for the host */
.controls {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
  padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); background: #070504e6; backdrop-filter: blur(6px);
}
.controls .btn { padding: 8px 14px; font-size: 15px; }
.controls .spacer { flex: 1; }
.controls .status { font-size: 14px; color: var(--muted); }
.controls .status.bad { color: var(--cranberry); font-weight: 700; }
.gate { max-width: 520px; margin: 12vh auto; display: flex; flex-direction: column; gap: 14px; }

/* new games */
.catpill { background: var(--teal); color: var(--ink); font-weight: 800; letter-spacing: .12em; text-transform: uppercase; font-size: 15px; padding: 6px 16px; border-radius: 999px; box-shadow: 0 4px 0 #070504; }
.tfrow { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; width: min(1000px, 100%); }
.tftile { border-radius: 22px; padding: 26px; display: flex; align-items: center; justify-content: center; gap: 16px; box-shadow: var(--shadow); transition: opacity .3s, transform .3s; }
.tftile .lbl { font-family: var(--f-brand); font-size: clamp(40px, 6vw, 96px); line-height: 1; }
.tftile .n { font-family: var(--f-display); font-size: 34px; background: #0003; border-radius: 999px; padding: 2px 16px; }
.tftile.fact { background: var(--teal); color: var(--ink); }
.tftile.fiction { background: var(--cranberry); color: var(--cream); }
.tftile.dim { opacity: .28; transform: scale(.96); }
.tftile.win { outline: 6px solid var(--cream); transform: scale(1.03); }
.why { font-size: clamp(20px, 2.2vw, 30px); font-weight: 600; max-width: 40ch; color: var(--cream); }
.lineup { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; width: min(760px, 100%); }
.lineup li { display: flex; align-items: center; gap: 16px; background: var(--cream); color: var(--ink); border-radius: 16px; padding: 12px 18px; font-weight: 800; font-size: clamp(20px, 2.2vw, 32px); box-shadow: var(--shadow); text-align: left; }
.fresh .lineup li { animation: pop .4s backwards; }
.lineup .pos { font-family: var(--f-display); width: 44px; height: 44px; display: grid; place-items: center; background: var(--brass); border-radius: 50%; flex: none; }
.emoji-big { font-size: clamp(90px, 14vw, 220px); line-height: 1.1; letter-spacing: .08em; filter: drop-shadow(0 8px 0 #070504); }
.fresh .emoji-big { animation: drop .6s cubic-bezier(.2,1.4,.4,1); }
.rank.crowned { background: var(--brass); color: var(--ink); }
.rank.crowned .g, .rank.crowned b { color: var(--ink); }
.sketch-wrap { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 28px; width: 100%; max-width: 1300px; align-items: center; }
.frame { background: #7a4a26; padding: 14px; border-radius: 14px; box-shadow: var(--shadow), inset 0 0 0 4px #5a3418; }
.sketch { display: block; width: 100%; height: auto; aspect-ratio: 1; max-height: 62vh; object-fit: contain; border-radius: 6px; background: #f6ead2; }
.sketch-side { display: flex; flex-direction: column; gap: 18px; align-items: flex-start; text-align: left; min-width: 0; }
.drawer { display: flex; align-items: center; gap: 16px; }
.drawer .nm { font-family: var(--f-brand); font-size: 40px; color: var(--mustard); }
.hint-word { font-family: var(--f-display); font-size: clamp(30px, 3.4vw, 54px); letter-spacing: .08em; color: var(--cream); white-space: pre-wrap; }
.feed { display: flex; flex-direction: column; gap: 6px; width: 100%; max-height: 34vh; overflow: hidden; }
.fd { display: flex; align-items: center; gap: 8px; background: var(--night-2); border-radius: 12px; padding: 4px 12px 4px 4px; font-size: 18px; min-width: 0; }
.fd span { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fd.ok { background: var(--leaf); color: var(--ink); font-weight: 700; }
.mixcard { display: flex; flex-wrap: wrap; align-items: center; gap: 18px 28px; background: linear-gradient(120deg, #3a2a1f, #241a14); border: 2px solid #e7b54a66; border-radius: 22px; padding: 22px 26px; box-shadow: var(--shadow); color: var(--cream); }
.mixcard > * { position: relative; z-index: 1; }
.mixtext { flex: 1; min-width: 260px; display: flex; flex-direction: column; gap: 4px; }
.mixtext h2 { font-size: clamp(40px, 4.5vw, 64px); line-height: 1; }
.mixtext p { margin: 0; max-width: 60ch; font-weight: 600; color: var(--muted); }
.mixcard .stepper { background: #0004; color: var(--cream); }
.btn.big { font-size: 22px; padding: 14px 26px; }
.nextup { display: flex; flex-direction: column; align-items: center; gap: 2px; background: var(--night-2); border: 2px solid #e7b54a55; border-radius: 16px; padding: 10px 26px; }
.nextup .western { font-size: clamp(28px, 3vw, 44px); }
@media (max-width: 900px) {
  .lobby { grid-template-columns: 1fr; }
  .sketch-wrap { grid-template-columns: 1fr; }
  .tiles { grid-template-columns: 1fr; }
  .vs { grid-template-columns: 1fr; }
  .vs .mid { justify-self: center; }
  .joincard { flex-direction: column; align-items: flex-start; }
}
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<div class="scene" aria-hidden="true">
<svg viewBox="0 0 1600 300" preserveAspectRatio="xMidYMax slice">
  <defs>
    <radialGradient id="moon" cx=".45" cy=".4" r=".6"><stop offset="0" stop-color="#ffe2a0"/><stop offset=".7" stop-color="#f0a14a"/><stop offset="1" stop-color="#d9782f"/></radialGradient>
    <radialGradient id="moonglow"><stop offset="0" stop-color="#f0a14a" stop-opacity=".35"/><stop offset="1" stop-color="#f0a14a" stop-opacity="0"/></radialGradient>
    <radialGradient id="lamp"><stop offset="0" stop-color="#ffd27a" stop-opacity=".9"/><stop offset="1" stop-color="#ffd27a" stop-opacity="0"/></radialGradient>
  </defs>
  <circle cx="1525" cy="78" r="150" fill="url(#moonglow)"/>
  <circle cx="1525" cy="78" r="58" fill="url(#moon)"/>
  <path d="M0 210 C 180 160 340 190 520 170 S 860 140 1040 175 1360 150 1600 180 V300 H0 Z" fill="#241811"/>
  <!-- windmill -->
  <g fill="none" stroke="#120c09" stroke-width="5"><path d="M245 270 L268 92 L291 270 M252 215 H284 M258 160 H279"/></g>
  <g class="blade" fill="#120c09"><path d="M268 50 l6 36 h-12 z M310 92 l-36 6 v-12 z M268 134 l-6 -36 h12 z M226 92 l36 -6 v12 z"/><circle cx="268" cy="92" r="7"/></g>
  <path d="M268 92 h46 l10 -8 v16 l-10 -8" fill="#120c09"/>
  <!-- barn + silo -->
  <g fill="#120c09">
    <rect x="1385" y="95" width="56" height="190"/><path d="M1385 95 a28 22 0 0 1 56 0 z"/>
    <path d="M1160 290 V150 L1192 104 L1262 78 L1332 104 L1364 150 V290 Z"/>
  </g>
  <circle class="glow" cx="1262" cy="128" r="46" fill="url(#lamp)"/>
  <path d="M1250 114 h24 v26 h-24 z" fill="#ffc861"/>
  <path d="M1262 114 v26 M1250 127 h24" stroke="#120c09" stroke-width="3"/>
  <path d="M1222 290 V205 h80 V290" fill="#1c130e"/>
  <path d="M1222 205 L1302 290 M1302 205 L1222 290" stroke="#120c09" stroke-width="5"/>
  <!-- front hill -->
  <path d="M0 250 C 260 225 520 245 800 236 S 1300 228 1600 248 V300 H0 Z" fill="#0d0907"/>
  <!-- fence -->
  <g fill="#0d0907"><rect x="0" y="232" width="1100" height="5"/><rect x="0" y="250" width="1100" height="5"/>
    <rect x="20" y="222" width="9" height="44"/><rect x="150" y="222" width="9" height="44"/><rect x="280" y="222" width="9" height="44"/><rect x="410" y="222" width="9" height="44"/><rect x="540" y="222" width="9" height="44"/><rect x="670" y="222" width="9" height="44"/><rect x="800" y="222" width="9" height="44"/><rect x="930" y="222" width="9" height="44"/><rect x="1060" y="222" width="9" height="44"/></g>
  <!-- hay bales and pumpkins -->
  <g fill="#0d0907"><rect x="560" y="246" width="70" height="34" rx="8"/><rect x="600" y="222" width="70" height="30" rx="8"/><rect x="640" y="248" width="70" height="34" rx="8"/></g>
  <g fill="#5a2a10"><ellipse cx="470" cy="270" rx="22" ry="16"/><ellipse cx="506" cy="276" rx="15" ry="11"/><ellipse cx="1000" cy="268" rx="26" ry="18"/></g>
  <g stroke="#2a1a0c" stroke-width="4" stroke-linecap="round"><path d="M470 254 l3 -8 M506 265 l2 -6 M1000 250 l4 -9"/></g>
</svg>
</div>
<main class="stage" id="stage"></main>
<div class="controls" id="controls"></div>

<script src="/static/vendor/qrcode.js"></script>
<script src="/static/common.js"></script>
<script>
"use strict";
const { h, connect, countdown, post, avatar, byId, pts, num, badge } = FF;
const params = new URLSearchParams(location.search);
const KEY = params.get("key") || "";
const stage = document.getElementById("stage"), controls = document.getElementById("controls");

let S = null, connected = false, flash = "", lastStep = null, soundOn = true;
let seen = new Set(); // ids already shown as joined/answered, so only newcomers animate
const rounds = {}; // chosen round counts per game
let mixCount = 6;

// ---------- sound (starts after the host's first click) ----------
let actx = null;
document.addEventListener("pointerdown", () => { try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); actx.resume(); } catch {} }, { once: false });
function tone(freq, dur = .15, type = "triangle", vol = .12, delay = 0) {
  if (!soundOn || !actx) return;
  try {
    const t = actx.currentTime + delay, o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t); g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + dur);
  } catch {}
}
const jingle = notes => notes.forEach((f, i) => tone(f, .22, "triangle", .12, i * .12));
document.addEventListener("tick", e => { if (e.detail > 0 && e.detail <= 5) tone(e.detail === 1 ? 880 : 660, .08, "square", .05); }, true);

// ---------- commands ----------
async function cmd(c, extra = {}) {
  const r = await post("/api/host", { key: KEY, cmd: c, ...extra });
  flash = r.error || "";
  if (r.error) render();
}

function fullscreen() {
  if (document.fullscreenElement) document.exitFullscreen?.().catch(() => {});
  else document.documentElement.requestFullscreen?.().catch(() => {});
}

// ---------- render ----------
function render() {
  if (!S) return;
  const g = S.game;
  const newStep = g ? g.step : "lobby";
  const fresh = newStep !== lastStep;
  if (fresh) { onPhaseChange(g); seen = new Set(); }
  lastStep = newStep;
  stage.classList.toggle("fresh", fresh);
  leaves.active = !g || g.phase === "intro" || g.phase === "final";
  document.body.classList.toggle("playing", !!g && g.phase !== "intro" && g.phase !== "final");

  stage.replaceChildren(...[topBar(g), ...(g ? gameScreen(g) : lobby())].filter(Boolean));
  renderControls(g);
}

function onPhaseChange(g) {
  if (!g) return;
  if (g.phase === "intro") jingle([392, 523, 659, 784]);
  else if (["reveal", "result"].includes(g.phase)) jingle([523, 659, 784]);
  else if (g.phase === "final") jingle([523, 659, 784, 1047, 784, 1047]);
  else tone(440, .18, "sine", .1);
}

function topBar(g) {
  const host = S.joinUrl.replace(/^https?:\/\//, "");
  return h("div", { class: "top" },
    g ? h("div", { class: "brand" }, badge(S.brand), h("span", { class: "western brass", text: `${S.brand.ranch} ${S.brand.event}` })) : null,
    h("div", { class: "spacer" }),
    g ? h("div", { class: "joinchip" }, "Join at ", h("b", { text: host })) : null);
}

function qrSVG(text) {
  const q = qrcode(0, "M"); q.addData(text); q.make();
  const box = h("div", { class: "qr", role: "img", "aria-label": "QR code for " + text });
  box.innerHTML = q.createSvgTag({ cellSize: 6, margin: 2, scalable: true });
  return box;
}

function lobby() {
  const ps = S.players;
  const out = [];
  out.push(h("section", { class: "lobby" },
    h("div", { class: "hero" },
      h("div", { class: "mark" },
        h("div", { class: "seal" }, badge(S.brand)),
        h("h1", { class: "wordmark western" },
          h("span", { class: "ranch brass", text: S.brand.ranch }),
          h("span", { class: "event brass", text: S.brand.event }),
          h("span", { class: "ribbon", text: S.brand.year }))),
      h("div", { class: "joincard stitched" },
        qrSVG(S.joinUrl),
        h("div", null,
          h("div", { class: "eyebrow", text: "Saddle up · same Wi-Fi" }),
          h("div", { class: "url", text: S.joinUrl.replace(/^https?:\/\//, "") }),
          h("div", { style: { marginTop: "6px", fontWeight: 700 }, text: "Scan the code or type the address to join the games." })))),
    h("div", { class: "roster stitched" },
      h("div", { class: "roster-head" },
        h("h2", { text: "The Posse" }),
        h("span", { class: "eyebrow", text: `${ps.filter(p => p.online).length} here` })),
      ps.length ? h("div", { class: "plist" }, [...ps].sort((a, b) => b.score - a.score).map(p => h("div", { class: "pl" + (p.online ? "" : " off") + (isNew("p" + p.id) ? " just" : "") },
        avatar(p),
        h("div", { style: { minWidth: 0, flex: 1 } }, h("div", { class: "nm", text: p.name }), h("div", { class: "sc", text: `${p.score.toLocaleString()} pts${p.online ? "" : " · away"}` })),
        h("button", { class: "kick", title: "Remove " + p.name, "aria-label": "Remove " + p.name, text: "✕", onclick: () => cmd("kick", { pid: p.id }) }))))
        : h("div", { class: "empty", text: "Nobody's ridden in yet. The first phone to join shows up here." }))));

  if (flash) out.push(h("div", { class: "flash", role: "alert", text: flash }));

  out.push(h("section", { class: "mixcard stitched" },
    h("div", { class: "mixtext" },
      h("div", { class: "eyebrow", text: "Can't decide? Play them all" }),
      h("h2", { class: "western brass", text: "Mix It Up" }),
      h("p", { text: "A random run of mini-games back to back: trivia, bluffing, drawing, voting and more. Short rounds, nonstop action, one big leaderboard." })),
    h("div", { class: "row" },
      h("div", { class: "stepper" },
        h("button", { "aria-label": "Fewer games", text: "−", onclick: () => { mixCount = Math.max(2, mixCount - 1); render(); } }),
        h("span", { text: `${mixCount} games` }),
        h("button", { "aria-label": "More games", text: "+", onclick: () => { mixCount = Math.min(12, mixCount + 1); render(); } })),
      h("button", { class: "btn go big", text: "Mix it up!", onclick: () => cmd("mix", { count: mixCount }) }))));

  out.push(h("h2", { class: "section-title", text: "Or pick a game" }));
  out.push(h("section", { class: "games" }, S.catalog.map(gm => {
    const n = Math.min(rounds[gm.key] ?? gm.rounds, gm.available || gm.rounds);
    const set = v => { rounds[gm.key] = Math.max(1, Math.min(gm.maxRounds, gm.available || gm.maxRounds, v)); render(); };
    return h("article", { class: "gcard stitched" },
      h("h3", { text: gm.title }),
      h("p", { text: gm.blurb }),
      h("div", { class: "meta", text: `${gm.min}+ players · ${gm.available} in the deck` }),
      h("div", { class: "row" },
        h("div", { class: "stepper" },
          h("button", { "aria-label": "Fewer", text: "−", onclick: () => set(n - 1) }),
          h("span", { text: `${n} ${n === 1 ? gm.unit.replace(/s$/, "") : gm.unit}` }),
          h("button", { "aria-label": "More", text: "+", onclick: () => set(n + 1) })),
        h("button", { class: "btn", text: "Play", onclick: () => cmd("start", { type: gm.key, rounds: n }) })));
  })));
  return out;
}

function gameScreen(g) {
  const P = byId(S.players);
  const online = S.players.filter(p => p.online);
  const head = h("div", { class: "gamehead" },
    h("div", { class: "gt", text: g.title }),
    progress(g) ? h("div", { class: "count", text: progress(g) }) : null,
    h("div", { class: "spacer" }),
    countdown(g.deadline));
  const waitRow = (doneIds, who = online) => h("div", { class: "waiting" },
    who.map(p => { const d = doneIds.includes(p.id); const a = avatar(p, "lg"); a.classList.add(d ? "done" : "pending"); if (d && isNew("d" + p.id)) a.classList.add("just"); a.title = p.name; return a; }));
  const blanked = q => { const parts = q.split("____"); return parts.flatMap((t, i) => i ? [h("span", { class: "blank", text: " " }), t] : [t]); };

      h("div", { class: "hint", text: "Phones out, partners" }));

      h("div", { class: "tiles" }, g.choices.map((c, k) => h("div", { class: `tile c${k}` + (reveal ? (k === g.correct ? " win" : " dim") : "") },
        h("span", { class: "shape", text: "ABCD"[k] }), h("span", { class: "tx", text: c }), reveal ? h("span", { class: "n", text: g.counts[k] }) : null))));
    if (!reveal) main.append(waitRow(g.answered), h("div", { class: "hint", text: "Answer on your phone. Faster right answers earn more." }));
    else main.append(resultChips(g.results, P));
  }

  if (g.type === "fib") {
    main.append(h("div", { class: "big-q" }, blanked(g.q)));
    if (g.phase === "write") main.append(h("div", { class: "hint", text: "Write a fake answer that sounds true. Fool your friends!" }), waitRow(g.written));
    if (g.phase === "pick") main.append(
      h("div", { class: "fibs" }, g.options.map((o, k) => h("div", { class: "fib", style: { animationDelay: k * .06 + "s" } }, h("div", { class: "tx", text: o })))),
      h("div", { class: "hint", text: "One of these is true. Find it on your phone." }), waitRow(g.picked));
    if (g.phase === "reveal") main.append(h("div", { class: "fibs" }, [...g.options].sort((a, b) => a.truth - b.truth).map((o, k) => h("div", { class: "fib" + (o.truth ? " truth" : ""), style: { animationDelay: k * .25 + "s" } },
      h("div", { class: "tag", text: o.truth ? "The truth" : o.house ? "House fib" : "Fib by " + o.authors.map(a => P[a]?.name || "?").join(" & ") }),
      h("div", { class: "tx", text: o.text }),
      h("div", { class: "who" }, o.pickers.length ? [o.pickers.map(id => P[id] ? avatar(P[id], "sm") : null), o.truth ? " found it" : ` fell for it${o.authors.length ? "" : ""}`] : h("span", { class: "eyebrow", text: "Nobody picked this" }))))),
      resultChips(g.results, P));
  }

  if (g.type === "quip") {
    if (g.phase === "write") {
      main.append(h("div", { class: "big-q", text: "Check your phone!" }),
        h("div", { class: "hint", text: "Everyone gets two prompts. Write the funniest answer you can." }),
        waitRow(g.done, online),
        h("div", { class: "count", text: `${g.answeredCount} of ${g.needed} answers in` }));
    } else {
      const res = g.phase === "result";
      const card = side => {
        const ans = side === "a" ? g.ansA : g.ansB, author = res ? P[side === "a" ? g.a : g.b] : null;
        const votes = res ? (side === "a" ? g.votesA : g.votesB) : [];
        const p = res ? g.pts[side === "a" ? g.a : g.b] : 0;
        const other = res ? g.pts[side === "a" ? g.b : g.a] : 0;
        return h("div", { class: `quip ${side}` + (res && p < other ? " loser" : "") },
          h("div", { class: "tx", text: ans ?? "(no answer)" }),
          res ? h("div", { class: "votes" }, votes.map(id => P[id] ? avatar(P[id], "sm") : null)) : null,
          res && author ? h("div", { class: "by" }, avatar(author), author.name, h("span", { class: "pts", text: pts(p) })) : null);
      };
      main.append(h("div", { class: "eyebrow", text: `Matchup ${g.k} of ${g.of}` }), h("div", { class: "big-q", text: g.prompt }),
        h("div", { class: "vs" }, card("a"), h("div", { class: "mid", text: "VS" }), card("b")));
      if (!res) main.append(h("div", { class: "hint", text: "Vote for your favorite on your phone" }), waitRow(g.voted, online.filter(p => true)));
      else if (g.sweep) main.append(h("div", { class: "sweep", text: "Clean sweep! +250" }));
      else if (g.forfeit) main.append(h("div", { class: "hint", text: "One side didn't answer, so the other wins by forfeit." }));
    }
  }

  if (g.type === "guess") {
    main.append(h("div", { class: "big-q", text: g.q }));
    if (g.phase === "guess") main.append(h("div", { class: "hint", text: "Type a number on your phone. Closest wins!" }), waitRow(g.guessed));
    else main.append(
      h("div", null, h("div", { class: "eyebrow", text: "The answer" }), h("div", { class: "answer-big", text: num(g.answer, g.unit) }), g.unit ? h("div", { class: "hint", text: g.unit }) : null),

  }

  if (g.type === "tf") {

    const tile = (val, label, cls) => h("div", { class: `tftile ${cls}` + (reveal ? (g.truth === val ? " win" : " dim") : "") },

    main.append(h("div", { class: "big-q", text: g.s }), h("div", { class: "tfrow" }, tile(true, "Fact", "fact"), tile(false, "Fiction", "fiction")));

    else {
      if (g.why) main.append(h("div", { class: "why", text: g.why }));
      const hot = S.players.filter(p => (g.streaks[p.id] || 0) >= 3);
      main.append(resultChips(g.results, P));
      if (hot.length) main.append(h("div", { class: "hint", text: "🔥 On a streak: " + hot.map(p => `${p.name} (${g.streaks[p.id]})`).join(", ") }));
    }

    main.append(h("div", { class: "eyebrow", text: "Put these in order" }), h("div", { class: "big-q", text: g.q }));
    if (!reveal) main.append(h("div", { class: "tiles" }, g.shown.map((c, k) => h("div", { class: `tile c${k}` }, h("span", { class: "shape", text: "ABCD"[k] }), h("span", { class: "tx", text: c })))),
      waitRow(g.answered), h("div", { class: "hint", text: "Tap them into order on your phone. 250 for each one in the right spot, plus a bonus for a perfect line." }));
    else main.append(h("ol", { class: "lineup" }, g.correct.map((c, k) => h("li", { style: { animationDelay: k * .2 + "s" } }, h("span", { class: "pos", text: k + 1 }), h("span", { text: c })))),
      resultChips(g.results, P));
  }

  if (g.type === "emoji") {
    main.append(h("div", { class: "eyebrow", text: g.cat ? `Name that ${g.cat.toLowerCase()}` : "Name it" }), h("div", { class: "emoji-big", text: g.e }));
    if (g.phase === "question") {
      const solvers = g.solvedIds.map(id => P[id]).filter(Boolean);
      main.append(h("div", { class: "hint", text: "Type your answer on your phone. First to solve it scores the most." }),
        solvers.length ? h("div", { class: "chips" }, solvers.map((p, k) => h("span", { class: "chip good" }, h("b", { text: k + 1 }), avatar(p, "sm"), p.name, " solved it"))) : null);
    } else main.append(h("div", { class: "answer-big", style: { fontSize: "clamp(40px, 6vw, 96px)" }, text: g.answer }), resultChips(g.results, P));
  }

  if (g.type === "herd") {

    const total = reveal ? g.counts.reduce((a, b) => a + b, 0) || 1 : 1;
    main.append(h("div", { class: "eyebrow", text: "Which way is the herd running?" }), h("div", { class: "big-q", text: g.q }),
      h("div", { class: "tiles" }, g.options.map((c, k) => h("div", { class: `tile c${k % 4}` + (reveal ? (g.herd.includes(k) ? " win" : " dim") : "") },
        h("span", { class: "shape", text: "ABCD"[k] }), h("span", { class: "tx", text: c }),
        reveal ? h("span", { class: "n", text: Math.round(100 * g.counts[k] / total) + "%" }) : null))));
    if (!reveal) main.append(waitRow(g.answered), h("div", { class: "hint", text: "No right answers. Pick what you think most people will pick." }));

      if (lone.length) main.append(h("div", { class: "hint", text: "🐄 Lone steer" + (lone.length > 1 ? "s" : "") + ": " + lone.map(p => p.name).join(", ") }));

function paintStrokes(cv, strokes) {
  const ctx = cv.getContext("2d"), k = cv.width / 1000;
  ctx.fillStyle = "#f6ead2"; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  for (const s of strokes) {
    const p = s.p; if (!p || p.length < 2) continue;
    ctx.strokeStyle = s.c; ctx.fillStyle = s.c; ctx.lineWidth = s.w * k;
    if (p.length === 2) { ctx.beginPath(); ctx.arc(p[0] * k, p[1] * k, s.w * k / 2, 0, 6.28); ctx.fill(); continue; }
    ctx.beginPath(); ctx.moveTo(p[0] * k, p[1] * k);
    for (let i = 2; i < p.length; i += 2) ctx.lineTo(p[i] * k, p[i + 1] * k);
    ctx.stroke();
  }
}

function isNew(k) { if (seen.has(k)) return false; seen.add(k); return true; }

function progress(g) {
  const mix = g.mix ? `Mix It Up · game ${g.mix.i + 1} of ${g.mix.n}` : "";
  let part = "";
  if (g.phase !== "intro" && g.phase !== "final") {
    if (g.total) part = `${g.i + 1} of ${g.total}`;
    else if (g.type === "quip") part = `Round ${g.round + 1} of ${g.rounds}`;
  }
  return [mix, part].filter(Boolean).join("  ·  ");
}

function resultChips(results, P) {
  const rows = S.players.filter(p => results && results[p.id]).sort((a, b) => results[b.id] - results[a.id]);
  if (!rows.length) return h("div", { class: "hint", text: "Nobody scored this time." });
  return h("div", { class: "chips" }, rows.map(p => h("span", { class: "chip good" }, avatar(p, "sm"), p.name, h("b", { text: pts(results[p.id]) }))));
}

function finalScreen(g, P) {
  const ranked = [...S.players].sort((a, b) => b.score - a.score);
  const mixDone = g.mix && g.mix.last;
  const earned = mixDone ? g.mix.earned : g.earned;
  const gameTop = [...S.players].sort((a, b) => (earned[b.id] || 0) - (earned[a.id] || 0))[0];
  const label = mixDone ? "Mix It Up champion" : g.title + " champion";
  return h("div", { class: "center intro" },
    g.nextUp ? h("div", { class: "nextup" }, h("span", { class: "eyebrow", text: "Next up" }), h("span", { class: "western brass", text: g.nextUp })) : null,
    gameTop && earned[gameTop.id] ? h("div", null, h("div", { class: "eyebrow", text: label }), h("h1", { class: "brass", text: gameTop.name })) : h("h1", { class: "brass", text: g.nextUp ? "Scores so far" : "That's a wrap" }),
    h("div", { class: "eyebrow", text: `${S.brand.ranch} ${S.brand.year} leaderboard` }),
    h("div", { class: "board" }, ranked.slice(0, 10).map((p, k) => h("div", { class: "brow" + (k === 0 ? " first" : ""), style: { animationDelay: k * .1 + "s" } },
      h("span", { class: "pos", text: k + 1 }), avatar(p), h("span", { class: "nm", text: p.name }),
      h("span", { class: "gain", text: earned[p.id] ? pts(earned[p.id]) + (mixDone ? " this mix" : " this game") : "" }),
      h("span", { class: "tot", text: p.score.toLocaleString("en-US") })))));
}

function renderControls(g) {
  const off = !connected;
  controls.replaceChildren(...[
    h("span", { class: "status" + (off ? " bad" : ""), text: off ? "Reconnecting to the game server…" : `${S ? S.players.filter(p => p.online).length : 0} players connected` }),
    h("span", { class: "spacer" }),
    g && (g.phase !== "final" || g.nextUp) ? h("button", { class: "btn gold", text: g.nextUp && g.phase === "final" ? "Start next game ▸" : "Skip ahead ▸", onclick: () => cmd("next") }) : null,
    g ? h("button", { class: "btn" + (g.phase === "final" && !g.nextUp ? " go" : ""), text: g.phase === "final" && !g.nextUp ? "Back to lobby" : g.mix ? "End mix" : "End game", onclick: () => cmd("lobby") }) : null,
    !g ? h("button", { class: "btn ghost", text: "Reset scores", onclick: e => armed(e.currentTarget, () => cmd("resetScores")) }) : null,
    !g ? h("button", { class: "btn ghost", text: "Clear players", onclick: e => armed(e.currentTarget, () => cmd("clearPlayers")) }) : null,
    h("button", { class: "btn ghost", text: soundOn ? "Sound on" : "Sound off", "aria-pressed": String(soundOn), onclick: () => { soundOn = !soundOn; renderControls(S.game); } }),
    h("button", { class: "btn ghost", text: "Fullscreen", onclick: fullscreen })].filter(Boolean));
}
// two-tap confirm for destructive buttons
function armed(btn, fn) {
  if (btn.dataset.armed) { fn(); return; }
  const label = btn.textContent; btn.dataset.armed = "1"; btn.textContent = "Tap again to confirm";
  setTimeout(() => { if (btn.isConnected) { delete btn.dataset.armed; btn.textContent = label; } }, 3000);
}

// ---------- night sky: twinkling stars and drifting leaves ----------
const leaves = (() => {
  const cv = document.getElementById("sky"), ctx = cv.getContext("2d");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const cols = ["#e2702c", "#e7b54a", "#b8322f", "#c4622a", "#9a4e1f"];
  let W, H, list = [], stars = [];
  const size = () => {
    W = cv.width = innerWidth; H = cv.height = innerHeight;
    stars = Array.from({ length: Math.round(W * H / 9000) }, () => ({ x: Math.random() * W, y: Math.random() * H * .7, r: Math.random() * 1.4 + .3, p: Math.random() * 6.28, s: .01 + Math.random() * .03 }));
  };
  size(); addEventListener("resize", size);
  const mk = y => ({ x: Math.random() * W, y: y ?? -20, r: 6 + Math.random() * 10, vy: .4 + Math.random() * .9, sw: Math.random() * 6.28, rot: Math.random() * 6.28, c: cols[Math.floor(Math.random() * cols.length)] });
  for (let i = 0; i < 24; i++) list.push(mk(Math.random() * H));
  const api = { active: true };
  function frame() {
    ctx.clearRect(0, 0, W, H);
    for (const st of stars) {
      st.p += st.s;
      ctx.globalAlpha = .35 + .45 * (0.5 + 0.5 * Math.sin(st.p));
      ctx.fillStyle = "#f6ead2"; ctx.beginPath(); ctx.arc(st.x, st.y, st.r, 0, 6.28); ctx.fill();
    }
    if (api.active) for (const l of list) {
      l.y += l.vy; l.sw += .02; l.rot += .01; l.x += Math.sin(l.sw) * .6;
      if (l.y > H + 20) Object.assign(l, mk());
      ctx.save(); ctx.translate(l.x, l.y); ctx.rotate(l.rot + Math.sin(l.sw)); ctx.globalAlpha = .6; ctx.fillStyle = l.c;
      ctx.beginPath(); ctx.ellipse(0, 0, l.r, l.r * .5, 0, 0, 6.28); ctx.fill();
      ctx.strokeStyle = "#0004"; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(-l.r, 0); ctx.lineTo(l.r, 0); ctx.stroke(); ctx.restore();
    }
    ctx.globalAlpha = 1;
    if (!reduce) requestAnimationFrame(frame);
  }
  frame();
  return api;
})();

// ---------- boot ----------
connect(`/events?role=host&key=${encodeURIComponent(KEY)}`, s => { S = s; connected = true; render(); }, ok => {
  connected = ok;
  if (!S && !ok) {
    stage.replaceChildren(h("div", { class: "gate" },
      h("h1", { class: "western brass", text: "Host screen locked" }),
      h("p", { text: "Open this page on the computer running the game, or use the host link with ?key= that the game printed when it started." })));
  }
  if (S) renderControls(S.game);
});
</script>
</body>
</html>
