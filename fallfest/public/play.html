<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15100d">
<title>Braznarkel Ranch Fall Fest 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rye&family=Alfa+Slab+One&family=Barlow:wght@500;600;700;800&display=swap">
<link rel="stylesheet" href="/static/theme.css">
<style>
.app { max-width: 520px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; gap: 18px;
  padding-block: calc(14px + env(safe-area-inset-top, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)); }
.bar { display: flex; align-items: center; gap: 10px; }
.bar .nm { font-weight: 700; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar .score { font-family: var(--f-display); color: var(--mustard); font-variant-numeric: tabular-nums; }
.bar .clock { font-size: 18px; }
.screen { flex: 1; display: flex; flex-direction: column; gap: 16px; }
.screen.fresh { animation: rise .3s ease-out; }
@keyframes rise { from { transform: translateY(14px); opacity: 0; } }
.title { font-family: var(--f-brand); font-size: 34px; line-height: 1.04; background: var(--brass); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 3px 0 #070504); }
.q { font-size: 21px; font-weight: 700; line-height: 1.3; }
.q .blank { color: var(--mustard); }
.muted { color: var(--muted); }
.card { background: var(--night-2); border-radius: 18px; padding: 16px; box-shadow: var(--shadow); position: relative; }
.card::after { content: ""; position: absolute; inset: 7px; border-radius: 12px; border: 2px dashed #c4ad8f33; pointer-events: none; }
.waitcard { text-align: center; display: flex; flex-direction: column; gap: 10px; align-items: center; padding: 28px 16px; }
.waitcard .big { font-family: var(--f-display); font-size: 28px; line-height: 1.05; }
.waitcard.good .big { color: var(--leaf); }
.waitcard.bad .big { color: var(--cranberry); }

.choices { display: grid; gap: 12px; }
.choice { background: var(--c, var(--night-3)); color: var(--ink); border: 0; border-radius: 18px; padding: 16px; min-height: 68px;
  display: flex; align-items: center; gap: 14px; text-align: left; font-size: 19px; font-weight: 700; box-shadow: 0 5px 0 #070504; }
.choice:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 2px 0 #070504; }
.choice .shape { width: 40px; height: 40px; display: grid; place-items: center; background: #0002; border-radius: 10px; flex: none; font-size: 22px; }
.choice span:last-child { min-width: 0; overflow-wrap: anywhere; }
.choice.plain { --c: var(--cream); }
.choice:disabled { opacity: .4; }
.choice.own { --c: var(--night-3); color: var(--muted); }

.form { display: flex; flex-direction: column; gap: 12px; }
.err { color: var(--cranberry); font-weight: 700; min-height: 1.4em; }
.emojis { display: grid; grid-template-columns: repeat(auto-fill, minmax(52px, 1fr)); gap: 8px; }
.emojis button { background: var(--night-2); border: 3px solid transparent; border-radius: 14px; font-size: 28px; padding: 6px 0; }
.emojis button[aria-pressed="true"] { border-color: var(--pumpkin); background: var(--night-3); }
.joinhero { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; margin-top: 4px; }
.joinhero .seal { width: 100%; max-width: 360px; animation: stamp .7s cubic-bezier(.2,1.5,.4,1); }
@keyframes stamp { from { transform: scale(1.6) rotate(-14deg); opacity: 0; } }
.joinhero .title { font-size: 40px; }
.joinhero .sub { font-family: var(--f-display); letter-spacing: .3em; color: var(--cream); background: var(--cranberry); padding: 2px 10px 2px 14px; font-size: 15px; }
.bar .logo { width: 96px; filter: none; }
.me { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; padding: 20px 0; }
.big-btn { font-size: 22px; padding: 16px; }
.offline { background: var(--cranberry); color: var(--cream); border-radius: 12px; padding: 8px 12px; font-weight: 700; text-align: center; }
.choices.two { grid-template-columns: 1fr 1fr; }
.big-choice { min-height: 140px; justify-content: center; font-family: var(--f-brand); font-size: 30px; font-weight: 400; }
.choice.fiction { --c: #c9483f; color: var(--cream); }
.choice.picked { outline: 4px solid var(--cream); }
.choice.player { gap: 12px; }
.row2 { display: flex; gap: 10px; align-items: center; }
.row2 .big-btn { flex: 1; }
.emoji-q { font-size: 72px; text-align: center; letter-spacing: .06em; line-height: 1.2; }
.secret { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; background: var(--night-2); border-radius: 14px; padding: 10px 14px; }
.secret b { font-family: var(--f-brand); font-size: 30px; color: var(--mustard); }
.padwrap { display: flex; flex-direction: column; gap: 10px; }
.pad { width: 100%; height: auto; aspect-ratio: 1; border-radius: 14px; touch-action: none; border: 6px solid #7a4a26; background: #f6ead2; }
.tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.tools .spacer { flex: 1; }
.tools .btn { padding: 8px 14px; }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; }
.sw { width: 34px; height: 34px; border-radius: 50%; border: 3px solid #0000; box-shadow: 0 0 0 2px #0006 inset; }
.sw[aria-pressed="true"] { border-color: var(--cream); transform: scale(1.12); }
.sizes { display: flex; gap: 6px; }
.sz { width: 40px; height: 40px; border-radius: 10px; background: var(--night-3); border: 2px solid transparent; display: grid; place-items: center; }
.sz i { background: var(--cream); border-radius: 50%; display: block; }
.sz[aria-pressed="true"] { border-color: var(--mustard); }
.hintword { font-family: var(--f-display); font-size: 26px; letter-spacing: .06em; text-align: center; white-space: pre-wrap; }
.progress { font-size: 14px; font-weight: 700; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
</style>
</head>
<body>
<div class="app" id="app"></div>
<script src="/static/common.js"></script>
<script>
"use strict";
const { h, connect, countdown, post, avatar, pts, num, logo } = FF;
const app = document.getElementById("app");
const EMOJI = ["🎃", "🍂", "🍁", "🌽", "🦃", "🍎", "🥧", "🦉", "🍄", "🐿️", "👻", "🦇", "🕷️", "🌻", "🧣", "☕", "🍩", "🍏", "🐈‍⬛", "🌰"];

const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
let myId = store.get("ffpp-id");
let S = null, online = true, lastKey = null, lastPhaseKey = null, editing = false, conn = null;
let draft = { name: store.get("ffpp-name") || "", emoji: store.get("ffpp-emoji") || EMOJI[Math.floor(Math.random() * EMOJI.length)] };
let errMsg = "";

function start() {
  conn && conn.close();
  conn = connect(`/events?role=player&id=${encodeURIComponent(myId || "")}`, s => { S = s; online = true; render(); }, ok => { online = ok; if (!ok) render(true); });
}

// Only rebuild when what THIS player sees changes, so typing isn't interrupted.
function screenKey() {
  const g = S.game ? { ...S.game } : null;
  if (g) for (const k of ["answered", "written", "picked", "voted", "guessed", "done", "answeredCount", "earned", "now", "feed", "solvedIds", "strokes"]) delete g[k];
  const rank = S.game && S.game.phase === "final" ? S.players.map(p => p.id + ":" + p.score).join() : "";
  return JSON.stringify({ me: S.me, g, editing, errMsg, online, rank });
}

function render(force) {
  if (!S && !force) return;
  const key = S ? screenKey() : "offline";
  if (key === lastKey) return;
  lastKey = key;
  const g = S && S.game;
  const phaseKey = g ? g.step : (S && S.me ? "lobby" : "join");
  const fresh = phaseKey !== lastPhaseKey; lastPhaseKey = phaseKey;

  const screen = h("div", { class: "screen" + (fresh ? " fresh" : "") });
  const append = screen.append.bind(screen);
  screen.append = (...kids) => append(...kids.filter(k => k != null && k !== false));
  const kids = [];
  if (!online) kids.push(h("div", { class: "offline", role: "status", text: "Reconnecting… stay on this page." }));
  if (!S) { app.replaceChildren(...kids); return; }

  if (!S.me || editing) { app.replaceChildren(...kids, joinScreen()); return; }

  kids.push(h("div", { class: "bar" }, logo(), avatar(S.me, "sm"), h("span", { class: "nm", text: S.me.name }),
    g && g.deadline ? countdown(g.deadline) : null,
    h("span", { class: "score", text: S.me.score.toLocaleString("en-US") + " pts" })));

  if (!g) lobby(screen);
  else if (g.phase === "intro") screen.append(h("div", { class: "progress", text: "Get ready" }), h("div", { class: "title", text: g.title }), h("p", { class: "q", text: g.blurb }), lookUp("Eyes on the big screen"));
  else if (g.phase === "final") finalScreen(screen, g);
  else ({ trivia, fib, quip, guess, tf, order, emoji, herd, likely, draw })[g.type](screen, g);

  const keep = {};
  for (const el of app.querySelectorAll("input[id], textarea[id]")) keep[el.id] = el.value;
  app.replaceChildren(...kids, screen);
  for (const el of screen.querySelectorAll("input[id], textarea[id]")) if (keep[el.id]) el.value = keep[el.id];
  const auto = screen.querySelector("[data-autofocus]");
  if (auto && fresh) auto.focus();
}

const lookUp = (big, sub, mood) => h("div", { class: "card waitcard" + (mood ? " " + mood : "") }, h("div", { class: "big", text: big }), sub ? h("div", { class: "muted", text: sub }) : null);
const act = async body => {
  const r = await post("/api/act", { id: myId, ...body });
  errMsg = r.error || ""; render();
  return r;
};
const blanked = q => q.split("____").flatMap((t, i) => i ? [h("span", { class: "blank", text: "_____" }), t] : [t]);

// ---------- join / lobby ----------
function joinScreen() {
  const nameIn = h("input", { class: "field", id: "name", maxlength: 14, autocomplete: "nickname", placeholder: "Your name", value: draft.name, "data-autofocus": "",
    oninput: e => { draft.name = e.target.value; } });
  const err = h("div", { class: "err", role: "alert", text: errMsg });
  const submit = async e => {
    e.preventDefault();
    if (!draft.name.trim()) { err.textContent = "Type a name to join."; return; }
    const r = await post("/api/join", { id: S && S.me ? myId : null, name: draft.name, emoji: draft.emoji });
    if (r.error) { err.textContent = r.error; return; }
    myId = r.id; store.set("ffpp-id", myId); store.set("ffpp-name", draft.name); store.set("ffpp-emoji", draft.emoji);
    editing = false; errMsg = ""; lastKey = null; start();
  };
  const emojis = h("div", { class: "emojis", role: "group", "aria-label": "Pick your icon" }, EMOJI.map(e => h("button", { type: "button", "aria-pressed": String(draft.emoji === e), text: e,
    onclick: ev => { draft.emoji = e; for (const b of emojis.children) b.setAttribute("aria-pressed", String(b === ev.currentTarget)); } })));
  setTimeout(() => nameIn.focus());
  return h("div", { class: "screen fresh" },
    h("div", { class: "joinhero" }, h("div", { class: "seal" }, logo()), h("div", { class: "title", text: `${(S && S.brand || {}).event || "Fall Fest"}` }), h("div", { class: "sub", text: `${(S && S.brand || {}).year || "2026"}` })),
    h("form", { class: "form", onsubmit: submit },
      h("label", { class: "eyebrow", for: "name", text: "Your name" }), nameIn,
      h("div", { class: "eyebrow", text: "Pick your icon" }), emojis, err,
      h("button", { class: "btn go big-btn", type: "submit", text: S && S.me ? "Save" : "Saddle up" }),
      S && S.me ? h("button", { class: "btn ghost", type: "button", text: "Cancel", onclick: () => { editing = false; render(); } }) : null));
}

function lobby(screen) {
  screen.append(h("div", { class: "me" }, avatar(S.me, "lg"),
    h("div", { class: "title", text: `Howdy, ${S.me.name}!` }),
    h("div", { class: "muted", text: `Welcome to the ${S.brand.ranch} ${S.brand.event}. Keep an eye on the big screen; the games start soon.` })),
    h("button", { class: "btn ghost", text: "Change name or icon", onclick: () => { draft = { name: S.me.name, emoji: S.me.emoji }; editing = true; render(); } }));
}

// ---------- games ----------
function trivia(screen, g) {
  screen.append(h("div", { class: "progress", text: `Question ${g.i + 1} of ${g.total}${g.cat ? " · " + g.cat : ""}` }), h("div", { class: "q", text: g.q }));
  if (g.phase === "question") {
    if (g.mine != null) return screen.append(lookUp("Locked in!", `You picked ${"ABCD"[g.mine]}. Waiting for everyone else.`));
    screen.append(h("div", { class: "choices" }, g.choices.map((c, k) => h("button", { class: `choice c${k}`, onclick: e => { e.currentTarget.disabled = true; act({ choice: k }); } },
      h("span", { class: "shape", text: "ABCD"[k] }), h("span", { text: c })))));
  } else {
    const p = g.results[S.me.id] || 0;
    screen.append(p ? lookUp("Correct! " + pts(p), "The faster you answer, the more you get.", "good")
      : lookUp(g.mine == null ? "Too slow!" : "Not this time", "The answer was " + g.choices[g.correct], "bad"));
  }
}

function fib(screen, g) {
  screen.append(h("div", { class: "progress", text: `Question ${g.i + 1} of ${g.total}` }), h("div", { class: "q" }, blanked(g.q)));
  if (g.phase === "write") {
    if (g.mine) return screen.append(lookUp("Fib submitted", `“${g.mine}”. Let's see who falls for it.`));
    const inp = h("input", { class: "field", id: "fib-" + g.step, maxlength: 40, autocomplete: "off", placeholder: "Write a believable fake answer", "data-autofocus": "" });
    screen.append(h("form", { class: "form", onsubmit: e => { e.preventDefault(); act({ text: inp.value }); } },
      inp, h("div", { class: "err", role: "alert", text: errMsg }), h("button", { class: "btn go big-btn", type: "submit", text: "Submit fib" })));
  } else if (g.phase === "pick") {
    if (g.mine != null) return screen.append(lookUp("Locked in!", `You picked “${g.options[g.mine]}”.`));
    screen.append(h("div", { class: "muted", text: "Which one is the truth?" }),
      h("div", { class: "choices" }, g.options.map((o, k) => h("button", { class: "choice plain" + (g.own[k] ? " own" : ""), disabled: g.own[k], onclick: e => { e.currentTarget.disabled = true; act({ choice: k }); } },
        h("span", { text: g.own[k] ? `${o} (your fib)` : o })))));
  } else {
    const p = g.results[S.me.id] || 0;
    const truth = g.options.find(o => o.truth);
    const foundIt = truth.pickers.includes(S.me.id);
    const fooled = g.options.filter(o => o.authors.includes(S.me.id)).flatMap(o => o.pickers.filter(x => x !== S.me.id)).length;
    screen.append(lookUp(p ? pts(p) : "No points", [foundIt ? "You found the truth." : `The truth was “${truth.text}”.`, fooled ? ` You fooled ${fooled} ${fooled === 1 ? "person" : "people"}!` : ""].join(""), p ? "good" : "bad"));
  }
}

function quip(screen, g) {
  if (g.phase === "write") {
    const todo = g.tasks.filter(t => !t.done);
    screen.append(h("div", { class: "progress", text: `Round ${g.round + 1} of ${g.rounds}` }));
    if (!g.tasks.length) return screen.append(lookUp("Sit tight", "You joined mid-round. You'll vote on the answers next."));
    if (!todo.length) return screen.append(lookUp("All done!", "Waiting for everyone else to finish."));
    const t = todo[0];
    const inp = h("textarea", { class: "field", id: `quip-${g.step}-${t.m}`, maxlength: 60, rows: 3, placeholder: "Be funny!", "data-autofocus": "" });
    screen.append(h("div", { class: "muted", text: `Prompt ${g.tasks.length - todo.length + 1} of ${g.tasks.length}` }), h("div", { class: "q", text: t.prompt }),
      h("form", { class: "form", onsubmit: e => { e.preventDefault(); act({ m: t.m, text: inp.value }); } },
        inp, h("div", { class: "err", role: "alert", text: errMsg }), h("button", { class: "btn go big-btn", type: "submit", text: "Send it" })));
    inp.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); act({ m: t.m, text: inp.value }); } });
  } else if (g.phase === "vote") {
    screen.append(h("div", { class: "progress", text: `Matchup ${g.k} of ${g.of}` }), h("div", { class: "q", text: g.prompt }));
    if (g.isAuthor) return screen.append(lookUp("Your answer is up!", "Everyone else is voting. Fingers crossed."));
    if (g.mine) return screen.append(lookUp("Vote counted", "Watch the screen for the results."));
    screen.append(h("div", { class: "choices" }, [["a", g.ansA, "c3"], ["b", g.ansB, "c1"]].map(([side, txt, c]) => h("button", { class: "choice " + c, onclick: e => { e.currentTarget.disabled = true; act({ side }); } },
      h("span", { text: txt })))));
  } else {
    const mine = g.pts && g.pts[S.me.id];
    screen.append(h("div", { class: "q", text: g.prompt }),
      mine != null ? lookUp(pts(mine) || "0 points", g.sweep && ((g.sweep === "a" && g.a === S.me.id) || (g.sweep === "b" && g.b === S.me.id)) ? "Clean sweep! Everybody voted for you." : "Nice work.", mine ? "good" : "bad")
        : lookUp("Results are up", "Look at the big screen."));
  }
}

function guess(screen, g) {
  screen.append(h("div", { class: "progress", text: `Question ${g.i + 1} of ${g.total}` }), h("div", { class: "q", text: g.q }));
  if (g.phase === "guess") {
    if (g.mine != null) return screen.append(lookUp("Guess locked in", `${num(g.mine, g.unit)} ${g.unit}`.trim()));
    const inp = h("input", { class: "field", id: "guess-" + g.step, inputmode: "decimal", autocomplete: "off", placeholder: g.unit ? `Number of ${g.unit}` : "Your guess", "data-autofocus": "" });
    screen.append(h("form", { class: "form", onsubmit: e => { e.preventDefault(); act({ value: inp.value }); } },
      inp, h("div", { class: "err", role: "alert", text: errMsg }), h("button", { class: "btn go big-btn", type: "submit", text: "Lock in guess" })));
  } else {
    const r = g.ranked.find(x => x.id === S.me.id);
    screen.append(lookUp(r && r.pts ? pts(r.pts) : "No points", `The answer was ${num(g.answer, g.unit)} ${g.unit}`.trim() + (r ? (r.diff ? `. You were off by ${num(+r.diff.toFixed(2), g.unit)}.` : ". Exact!") : "."), r && r.pts ? "good" : "bad"));
  }
}

function tf(screen, g) {
  screen.append(h("div", { class: "progress", text: `Statement ${g.i + 1} of ${g.total}` }), h("div", { class: "q", text: g.s }));
  if (g.phase === "question") {
    if (g.mine != null) return screen.append(lookUp("Locked in!", `You said ${g.mine ? "fact" : "fiction"}.`));
    screen.append(h("div", { class: "choices two" },
      h("button", { class: "choice big-choice c1", onclick: e => { e.currentTarget.disabled = true; act({ choice: true }); } }, h("span", { text: "Fact" })),
      h("button", { class: "choice big-choice fiction", onclick: e => { e.currentTarget.disabled = true; act({ choice: false }); } }, h("span", { text: "Fiction" }))),
      g.streak > 1 ? h("div", { class: "muted", text: `🔥 ${g.streak} in a row! Keep it going.` }) : null);
  } else {
    const p = g.results[S.me.id] || 0;
    screen.append(p ? lookUp("Right! " + pts(p), g.streaks[S.me.id] > 1 ? `🔥 Streak of ${g.streaks[S.me.id]}` : g.why, "good")
      : lookUp(g.mine == null ? "Too slow!" : "Nope!", `It's ${g.truth ? "a fact" : "fiction"}. ${g.why}`, "bad"));
  }
}

let orderPick = { step: null, seq: [] };
function order(screen, g) {
  screen.append(h("div", { class: "progress", text: `Puzzle ${g.i + 1} of ${g.total}` }), h("div", { class: "q", text: g.q }));
  if (g.phase === "question") {
    if (g.mine) return screen.append(lookUp("Locked in!", g.mine.map((k, n) => `${n + 1}. ${g.shown[k]}`).join("   ")));
    if (orderPick.step !== g.step) orderPick = { step: g.step, seq: [] };
    const seq = orderPick.seq;
    const redraw = () => { lastKey = null; render(); };
    screen.append(h("div", { class: "muted", text: "Tap them in order, first to last." }),
      h("div", { class: "choices" }, g.shown.map((c, k) => {
        const at = seq.indexOf(k);
        return h("button", { class: `choice c${k}` + (at >= 0 ? " picked" : ""), onclick: () => { if (at >= 0) seq.splice(at); else seq.push(k); redraw(); } },
          h("span", { class: "shape", text: at >= 0 ? String(at + 1) : "·" }), h("span", { text: c }));
      })),
      h("div", { class: "err", role: "alert", text: errMsg }),
      h("div", { class: "row2" },
        h("button", { class: "btn ghost", text: "Start over", disabled: !seq.length, onclick: () => { seq.length = 0; redraw(); } }),
        h("button", { class: "btn go big-btn", text: "Lock it in", disabled: seq.length !== g.shown.length, onclick: () => act({ order: seq.slice() }) })));
  } else {
    const p = g.results[S.me.id] || 0, r = g.right[S.me.id];
    screen.append(lookUp(p ? pts(p) : "No points", (r == null ? "You didn't lock in. " : `${r} of ${g.correct.length} in the right spot. `) + "Right order: " + g.correct.join(" → "), p ? "good" : "bad"));
  }
}

function emoji(screen, g) {
  screen.append(h("div", { class: "progress", text: `Puzzle ${g.i + 1} of ${g.total}${g.cat ? " · " + g.cat : ""}` }), h("div", { class: "emoji-q", text: g.e }));
  if (g.phase === "question") {
    if (g.solved) return screen.append(lookUp("You got it!", "Nice. Watch the others squirm.", "good"));
    const inp = h("input", { class: "field", id: "emoji-" + g.step, maxlength: 40, autocomplete: "off", placeholder: g.cat ? `Name the ${g.cat.toLowerCase()}` : "Your answer", "data-autofocus": "" });
    screen.append(h("form", { class: "form", onsubmit: e => { e.preventDefault(); const v = inp.value; inp.value = ""; act({ text: v }); } },
      inp, h("div", { class: "err", role: "alert", text: errMsg }), h("button", { class: "btn go big-btn", type: "submit", text: "Guess" })),
      g.tries ? h("div", { class: "muted", text: `Guesses so far: ${g.tries}` }) : null);
  } else {
    const p = g.results[S.me.id] || 0;
    screen.append(lookUp(p ? pts(p) : "No points", "It was " + g.answer, p ? "good" : "bad"));
  }
}

function herd(screen, g) {
  screen.append(h("div", { class: "progress", text: `Question ${g.i + 1} of ${g.total}` }), h("div", { class: "q", text: g.q }));
  if (g.phase === "question") {
    if (g.mine != null) return screen.append(lookUp("Locked in!", `You picked ${g.options[g.mine]}. Let's see if the herd agrees.`));
    screen.append(h("div", { class: "muted", text: "Pick what you think most people will pick." }),
      h("div", { class: "choices" }, g.options.map((c, k) => h("button", { class: `choice c${k % 4}`, onclick: e => { e.currentTarget.disabled = true; act({ choice: k }); } },
        h("span", { class: "shape", text: "ABCD"[k] }), h("span", { text: c })))));
  } else {
    const p = g.results[S.me.id] || 0, lone = (g.lone || []).includes(S.me.id);
    screen.append(lookUp(p ? "With the herd! " + pts(p) : lone ? "Lone steer!" : "Off the trail", "The herd picked " + g.herd.map(k => g.options[k]).join(" & "), p ? "good" : "bad"));
  }
}

function likely(screen, g) {
  screen.append(h("div", { class: "progress", text: `Question ${g.i + 1} of ${g.total}` }), h("div", { class: "muted", text: "Who's most likely to…" }), h("div", { class: "q", text: g.q + "?" }));
  if (g.phase === "vote") {
    if (g.mine) { const t = S.players.find(p => p.id === g.mine); return screen.append(lookUp("Vote cast", `You picked ${t ? t.name : "someone"}.`)); }
    screen.append(h("div", { class: "choices" }, S.players.filter(p => p.id !== S.me.id && p.online).map(p => h("button", { class: "choice plain player", onclick: e => { e.currentTarget.disabled = true; act({ target: p.id }); } },
      avatar(p, "sm"), h("span", { text: p.name })))));
  } else {
    const p = g.results[S.me.id] || 0, crowned = g.crowned.includes(S.me.id);
    const names = g.crowned.map(id => (S.players.find(x => x.id === id) || {}).name).filter(Boolean);
    screen.append(lookUp(crowned ? "👑 It's you!" : p ? "You read the room! " + pts(p) : "Not this time", names.length ? "The room picked " + names.join(" & ") : "", p ? "good" : "bad"));
  }
}

// ---------- Scarecrow Sketch: drawing pad for the drawer, guesses for everyone else ----------
let pad = null;
function drawPad(step) {
  if (pad && pad.step === step) return pad;
  const COLORS = ["#1d140e", "#e2702c", "#e7b54a", "#b8322f", "#4f9a95", "#6b8f3a", "#7a4a26", "#ffffff"];
  const SIZES = [6, 14, 28];
  const st = { step, strokes: [], color: COLORS[0], size: SIZES[0], dirty: false, cur: null };
  const cv = h("canvas", { class: "pad", width: 800, height: 800 });
  const ctx = cv.getContext("2d");
  const paint = () => {
    ctx.fillStyle = "#f6ead2"; ctx.fillRect(0, 0, 800, 800); ctx.lineCap = "round"; ctx.lineJoin = "round";
    for (const s of st.strokes) {
      const p = s.p; ctx.strokeStyle = ctx.fillStyle = s.c; ctx.lineWidth = s.w * .8;
      if (p.length === 2) { ctx.beginPath(); ctx.arc(p[0] * .8, p[1] * .8, s.w * .4, 0, 6.28); ctx.fill(); continue; }
      ctx.beginPath(); ctx.moveTo(p[0] * .8, p[1] * .8); for (let i = 2; i < p.length; i += 2) ctx.lineTo(p[i] * .8, p[i + 1] * .8); ctx.stroke();
    }
  };
  const pt = e => { const r = cv.getBoundingClientRect(); return [Math.round((e.clientX - r.left) / r.width * 1000), Math.round((e.clientY - r.top) / r.height * 1000)]; };
  cv.addEventListener("pointerdown", e => { e.preventDefault(); cv.setPointerCapture(e.pointerId); st.cur = { c: st.color, w: st.size, p: pt(e) }; st.strokes.push(st.cur); st.dirty = true; paint(); });
  cv.addEventListener("pointermove", e => {
    if (!st.cur) return; e.preventDefault();
    const [x, y] = pt(e), p = st.cur.p;
    if (Math.hypot(x - p[p.length - 2], y - p[p.length - 1]) < 6) return;
    p.push(x, y); st.dirty = true; paint();
  });
  const end = () => { st.cur = null; };
  cv.addEventListener("pointerup", end); cv.addEventListener("pointercancel", end);
  const swatches = h("div", { class: "swatches" }, COLORS.map(c => h("button", { class: "sw", style: { background: c }, "aria-label": "Color", "aria-pressed": String(c === st.color),
    onclick: e => { st.color = c; for (const b of swatches.children) b.setAttribute("aria-pressed", String(b === e.currentTarget)); } })));
  const sizes = h("div", { class: "sizes" }, SIZES.map(w => h("button", { class: "sz", "aria-label": "Brush size", "aria-pressed": String(w === st.size),
    onclick: e => { st.size = w; for (const b of sizes.children) b.setAttribute("aria-pressed", String(b === e.currentTarget)); } }, h("i", { style: { width: w / 1.4 + "px", height: w / 1.4 + "px" } }))));
  st.el = h("div", { class: "padwrap" }, cv,
    h("div", { class: "tools" }, swatches),
    h("div", { class: "tools" }, sizes, h("span", { class: "spacer" }),
      h("button", { class: "btn ghost", text: "Undo", onclick: () => { st.strokes.pop(); st.dirty = true; paint(); } }),
      h("button", { class: "btn ghost", text: "Clear", onclick: () => { st.strokes = []; st.dirty = true; paint(); } })));
  paint();
  // Send the picture to the big screen a few times a second while drawing.
  st.timer = setInterval(() => {
    if (!S || !S.game || S.game.step !== step) { clearInterval(st.timer); return; }
    if (st.dirty) { st.dirty = false; post("/api/act", { id: myId, strokes: st.strokes }); }
  }, 350);
  pad = st;
  return st;
}

function draw(screen, g) {
  screen.append(h("div", { class: "progress", text: `Drawing ${g.i + 1} of ${g.total}` }));
  if (g.phase === "draw") {
    if (g.isDrawer) {
      screen.append(h("div", { class: "secret" }, h("span", { class: "muted", text: "Draw this (shh!)" }), h("b", { text: g.word })),
        drawPad(g.step).el, h("div", { class: "muted", text: "No letters or numbers. Your drawing shows on the big screen." }));
      return;
    }
    const drawer = S.players.find(p => p.id === g.drawer);
    if (g.solved) return screen.append(lookUp("You got it!", "Now watch everyone else struggle.", "good"));
    const inp = h("input", { class: "field", id: "draw-" + g.step, maxlength: 30, autocomplete: "off", placeholder: "What is it?", "data-autofocus": "" });
    screen.append(h("div", { class: "q", text: `${drawer ? drawer.name : "Someone"} is drawing. Look at the big screen!` }),
      h("div", { class: "hintword", text: g.hint.split("").join(" ") }),
      h("form", { class: "form", onsubmit: e => { e.preventDefault(); const v = inp.value; inp.value = ""; act({ text: v }); } },
        inp, h("div", { class: "err", role: "alert", text: errMsg }), h("button", { class: "btn go big-btn", type: "submit", text: "Guess" })));
  } else {
    const p = g.results[S.me.id] || 0;
    screen.append(lookUp(p ? pts(p) : "No points", "The word was " + g.word, p ? "good" : "bad"));
  }
}

function finalScreen(screen, g) {
  const ranked = [...S.players].sort((a, b) => b.score - a.score);
  const place = ranked.findIndex(p => p.id === S.me.id) + 1;
  const earned = g.earned[S.me.id] || 0;
  const suffix = n => (n % 10 === 1 && n % 100 !== 11) ? "st" : (n % 10 === 2 && n % 100 !== 12) ? "nd" : (n % 10 === 3 && n % 100 !== 13) ? "rd" : "th";
  screen.append(h("div", { class: "progress", text: g.title + " is over" }),
    h("div", { class: "me" }, avatar(S.me, "lg"), h("div", { class: "title", text: `${place}${suffix(place)} place` }),
      h("div", { class: "muted", text: `${pts(earned)} this game · ${S.me.score.toLocaleString("en-US")} total` })),
    g.nextUp ? lookUp("Next up: " + g.nextUp, "Starting in a few seconds. Stay on this page!", "good") : lookUp("Check the leaderboard!", "Stay on this page, more games are coming."));
}

start();
</script>
</body>
</html>
